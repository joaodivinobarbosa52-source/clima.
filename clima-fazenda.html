<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clima da Fazenda</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7d46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#eef2ef;--ink:#16231b;--mut:#5b6b61;--card:#fff;--line:#d3dcd6;--rain:#1b6ca8;--soil:#7a5a3a;--ok:#2f7d46}
@media(prefers-color-scheme:dark){:root{--bg:#121a15;--ink:#e6efe9;--mut:#93a699;--card:#1b261f;--line:#2c3a31;--rain:#5aaee6;--soil:#c9a27a;--ok:#5ec27a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header b{font-size:17px}
.btn,button{background:var(--ok);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button[hidden]{display:none}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--line)}
button:focus-visible,.btn:focus-within,select:focus-visible,input:focus-visible{outline:2px solid var(--rain);outline-offset:2px}
#map{flex:0 0 42%;min-height:200px}
#panel{flex:1;overflow:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:10px}
select,input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label{font-size:13px;color:var(--mut);display:block}
#info{display:flex;gap:16px;flex-wrap:wrap}
#info div{font-size:13px;color:var(--mut)}
#info strong{display:block;font-size:20px;color:var(--ink)}
.row{display:grid;grid-template-columns:62px 1fr 64px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.row.past{color:var(--mut)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rain)}
.row small{display:block;color:var(--mut);font-size:12px}
.row span:last-child{text-align:right;font-weight:600}
.act{display:flex;gap:8px}
.act button:first-child{flex:1}
#msg{color:var(--mut)}
</style>
</head>
<body>
<header>
  <b>Clima da Fazenda</b>
  <button id="inst" class="sec" hidden>Instalar app</button>
  <label class="btn">Importar talhões<input type="file" id="f" accept=".kml,.kmz,.zip,.json,.geojson" multiple hidden></label>
</header>
<div id="map"></div>
<main id="panel">
  <select id="sel" aria-label="Talhão"></select>
  <div id="info"></div>
  <div id="days"></div>
  <p id="msg"></p>
  <label>WhatsApp de destino (opcional, com DDI e DDD)
    <input id="num" inputmode="tel" placeholder="5563999999999">
  </label>
  <div class="act">
    <button id="send">Enviar resumo no WhatsApp</button>
    <button id="del" class="sec">Excluir</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/shpjs@4.0.4/dist/shp.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let fields = [], cur = null, layer = null, wx = null;
try { fields = JSON.parse(localStorage.getItem('cf_fields') || '[]'); $('num').value = localStorage.getItem('cf_num') || ''; } catch (e) {}
const save = () => { try { localStorage.setItem('cf_fields', JSON.stringify(fields)); } catch (e) {} };

/* Mapa */
const map = L.map('map').setView([-10.2, -48.3], 6);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri' }).addTo(map);
const ctrl = L.control.layers(null, {}, { collapsed: true }).addTo(map);
fetch('https://api.rainviewer.com/public/weather-maps.json').then(r => r.json()).then(j => {
  const p = j.radar.past[j.radar.past.length - 1].path;
  ctrl.addOverlay(L.tileLayer(j.host + p + '/256/{z}/{x}/{y}/2/1_1.png', { opacity: .7, maxNativeZoom: 7 }), 'Radar de chuva');
}).catch(() => {});

/* Importação */
const fromKml = t => toGeoJSON.kml(new DOMParser().parseFromString(t, 'text/xml')).features;
async function parse(file) {
  const n = file.name.toLowerCase();
  if (n.endsWith('.kmz')) {
    const z = await JSZip.loadAsync(file);
    const k = Object.keys(z.files).find(x => x.toLowerCase().endsWith('.kml'));
    return fromKml(await z.files[k].async('string'));
  }
  if (n.endsWith('.kml')) return fromKml(await file.text());
  if (n.endsWith('.zip')) return [].concat(await shp(await file.arrayBuffer())).flatMap(x => x.features);
  const j = JSON.parse(await file.text());
  return j.features || [j];
}
$('f').onchange = async e => {
  let n = 0;
  for (const file of e.target.files) {
    try {
      const base = file.name.replace(/\.[^.]+$/, '');
      (await parse(file)).filter(f => f.geometry && /Polygon/.test(f.geometry.type)).forEach((f, i) => {
        fields.push({ id: Date.now() + n, name: (f.properties && f.properties.name) || base + ' ' + (i + 1), geometry: f.geometry });
        n++;
      });
    } catch (err) { $('msg').textContent = 'Não consegui ler ' + file.name + '. Use KML, KMZ, GeoJSON ou shapefile em .zip.'; }
  }
  e.target.value = '';
  if (n) { save(); cur = fields[fields.length - 1].id; refresh(); }
};

/* Geometria */
const rings = g => g.type === 'Polygon' ? [g.coordinates[0]] : g.coordinates.map(p => p[0]);
const mm = a => a.reduce((r, v) => [Math.min(r[0], v), Math.max(r[1], v)], [1e9, -1e9]);
function stats(g) {
  const xs = [], ys = []; let area = 0;
  rings(g).forEach(r => {
    const kx = 111320 * Math.cos(r[0][1] * Math.PI / 180), ky = 110540; let s = 0;
    r.forEach(p => { xs.push(p[0]); ys.push(p[1]); });
    for (let i = 0; i < r.length - 1; i++) s += r[i][0] * kx * r[i + 1][1] * ky - r[i + 1][0] * kx * r[i][1] * ky;
    area += Math.abs(s) / 2;
  });
  const [x0, x1] = mm(xs), [y0, y1] = mm(ys);
  return { ha: area / 1e4, lat: (y0 + y1) / 2, lon: (x0 + x1) / 2 };
}

/* Tela */
function refresh() {
  $('sel').innerHTML = fields.map(f => `<option value="${f.id}" ${f.id === cur ? 'selected' : ''}>${f.name.replace(/</g, '&lt;')}</option>`).join('');
  const f = fields.find(x => x.id === cur) || fields[0];
  if (layer) { map.removeLayer(layer); layer = null; }
  if (!f) {
    $('info').innerHTML = ''; $('days').innerHTML = '';
    $('msg').textContent = 'Importe o perímetro da fazenda (KML, KMZ, GeoJSON ou shapefile .zip) para ver chuva e previsão.';
    return;
  }
  cur = f.id; $('msg').textContent = '';
  layer = L.geoJSON(f.geometry, { style: { color: '#ffd54a', weight: 2, fillOpacity: .1 } }).addTo(map);
  map.fitBounds(layer.getBounds(), { maxZoom: 16 });
  loadWx(f);
}
$('sel').onchange = e => { cur = +e.target.value; refresh(); };
$('del').onclick = () => { if (cur && confirm('Excluir este talhão?')) { fields = fields.filter(f => f.id !== cur); cur = null; save(); refresh(); } };
$('num').onchange = e => { try { localStorage.setItem('cf_num', e.target.value); } catch (x) {} };

/* Clima */
const dm = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const sum = a => a.reduce((x, y) => x + (y || 0), 0);
async function loadWx(f) {
  const s = stats(f.geometry); wx = null;
  $('days').innerHTML = '<p id="msg">Carregando previsão…</p>';
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${s.lat.toFixed(4)}&longitude=${s.lon.toFixed(4)}&current=temperature_2m,precipitation&daily=precipitation_sum,precipitation_probability_max,temperature_2m_max,temperature_2m_min&past_days=3&forecast_days=7&timezone=auto`;
    wx = await (await fetch(u)).json();
    const d = wx.daily, p = d.precipitation_sum;
    $('info').innerHTML = `<div><strong>${s.ha.toFixed(1)} ha</strong>área</div><div><strong>${sum(p.slice(0, 3)).toFixed(1)} mm</strong>últimos 3 dias</div><div><strong>${sum(p.slice(3)).toFixed(1)} mm</strong>próximos 7 dias</div><div><strong>${wx.current.precipitation} mm</strong>agora</div>`;
    const max = Math.max(10, ...p.map(v => v || 0));
    $('days').innerHTML = d.time.map((t, i) => `<div class="row ${i < 3 ? 'past' : ''}"><span>${dm(t)}${i < 3 ? '<small>choveu</small>' : i === 3 ? '<small>hoje</small>' : ''}</span><div class="bar"><i style="width:${(p[i] || 0) / max * 100}%"></i></div><span>${(p[i] || 0).toFixed(1)} mm${i >= 3 ? `<small>${d.precipitation_probability_max[i] ?? '-'}%</small>` : ''}</span></div>`).join('');
  } catch (e) { $('days').innerHTML = '<p id="msg">Sem conexão com a previsão. Tente de novo.</p>'; }
}

/* WhatsApp */
$('send').onclick = () => {
  const f = fields.find(x => x.id === cur);
  if (!f || !wx) { $('msg').textContent = 'Aguarde a previsão carregar.'; return; }
  const s = stats(f.geometry), d = wx.daily, p = d.precipitation_sum;
  let t = `*${f.name}* (${s.ha.toFixed(1)} ha)\n`;
  t += `Chuva nos últimos 3 dias: ${sum(p.slice(0, 3)).toFixed(1)} mm\n`;
  t += `Hoje: ${(p[3] || 0).toFixed(1)} mm, ${d.temperature_2m_min[3]}° a ${d.temperature_2m_max[3]}°\n\n*Previsão*\n`;
  for (let i = 4; i < d.time.length; i++) t += `${dm(d.time[i])}: ${(p[i] || 0).toFixed(1)} mm (${d.precipitation_probability_max[i] ?? '-'}%)\n`;
  t += `\nTotal 7 dias: ${sum(p.slice(3)).toFixed(1)} mm\nLocal: https://maps.google.com/?q=${s.lat.toFixed(5)},${s.lon.toFixed(5)}`;
  const n = $('num').value.replace(/\D/g, '');
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(t)}`, '_blank');
};

refresh();

/* PWA */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let ev = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); ev = e; $('inst').hidden = false; });
$('inst').onclick = async () => { if (!ev) return; ev.prompt(); await ev.userChoice; ev = null; $('inst').hidden = true; };
addEventListener('appinstalled', () => { $('inst').hidden = true; });
</script>
</body>
</html>
